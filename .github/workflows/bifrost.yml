name: Bifrost Integration

on:
  push:
    tags-ignore:
      - 'v*'
    branches:
      - 'main'
    paths-ignore:
      - 'docs/**'
      - 'openwiki/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'docs/**'
      - 'openwiki/**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  bifrost:
    # Secrets are unavailable to forks and Dependabot, so there is nothing to test against.
    if: ${{ github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Bifrost integration test
        # An empty BIFROST_URL falls back to the default gateway URL.
        run: mvn -B -Dtest=BifrostIntegrationTest -Dsurefire.failIfNoSpecifiedTests=false test
        env:
          BIFROST_API_KEY: ${{ secrets.BIFROST_API_KEY }}
          BIFROST_URL: ${{ secrets.BIFROST_URL }}
